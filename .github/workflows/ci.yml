name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Immutable full commit SHA to qualify when called by the release workflow
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref || 'default' }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - name: Verify immutable reusable-workflow source
        if: inputs.ref != ''
        env:
          SOURCE_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_REF" =~ ^[0-9a-f]+$ ]] || [[ "${#SOURCE_REF}" -ne 40 ]]; then
            echo "::error::workflow_call ref must be a lowercase full 40-character commit SHA" >&2
            exit 1
          fi
          head_ref='HEAD^{commit}'
          checked_out="$(git rev-parse --verify "$head_ref")"
          if [[ "$checked_out" != "$SOURCE_REF" ]]; then
            echo "::error::workflow_call checkout resolved to ${checked_out}, expected ${SOURCE_REF}" >&2
            exit 1
          fi

      - name: Install pinned Hooversion
        uses: openhoo/hooversion/actions/setup@7c5d4a15a55ec06f7e3b0b10af36b9070ea065e7 # v1.1.0
        with:
          version: 1.1.0

      - name: Lint changed commit range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            test -n "$PR_BASE_SHA"
            test -n "$PR_HEAD_SHA"
            hooversion lint --from "$PR_BASE_SHA" --to "$PR_HEAD_SHA"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            hooversion lint --from HEAD^ --to HEAD
          else
            hooversion lint --last
          fi

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: commitlint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install frontend dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build frontend
        run: npm run build

  native:
    name: Native Rust checks
    runs-on: ubuntu-latest
    needs: commitlint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}

      - name: Require the repository-pinned Rust toolchain
        run: |
          set -euo pipefail
          if [[ ! -f rust-toolchain.toml ]]; then
            echo '::error::rust-toolchain.toml is required and must pin Rust 1.98.0.' >&2
            exit 1
          fi
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('rust-toolchain.toml').read_text(encoding='utf-8')
          match = re.search(r'(?m)^channel\s*=\s*["\']([^"\']+)["\']\s*$', text)
          if not match or match.group(1) != '1.98.0':
              raise SystemExit('::error::rust-toolchain.toml must pin channel 1.98.0')
          PY
          rustc --version

      - name: Install Linux Tauri build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf
      - name: Check native package
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets --features linux-helper
      - name: Test native library
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features linux-helper --lib
      - name: Audit Rust dependencies (informational, no ignore file)
        run: |
          set -euo pipefail
          cargo install cargo-audit --version 0.22.0 --locked --root "$RUNNER_TEMP/cargo-audit"
          set +e
          "$RUNNER_TEMP/cargo-audit/bin/cargo-audit" audit --file src-tauri/Cargo.lock \
            | tee "$RUNNER_TEMP/cargo-audit.log"
          audit_status="${PIPESTATUS[0]}"
          set -e
          cat "$RUNNER_TEMP/cargo-audit.log" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$audit_status" -ne 0 ]]; then
            echo "::warning::cargo audit reported dependency findings; this informational result is intentionally not suppressed or ignored."
          fi


      - name: Check native formatting
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

  release-metadata:
    name: Release metadata contract
    runs-on: ubuntu-latest
    needs: [frontend, native]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}

      - name: Read version and verify metadata
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import json
          print(json.load(open('package.json', encoding='utf-8'))['version'])
          PY
          )"
          bash scripts/release/verify-manifests.sh "$version"
